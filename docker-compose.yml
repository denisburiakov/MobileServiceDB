services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: my_db_user
      POSTGRES_PASSWORD: my_db_password
      POSTGRES_DB: my_database_name
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_db_user -d my_database_name"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: aspnet_app
    restart: always
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=my_database_name;Username=my_db_user;Password=my_db_password
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: